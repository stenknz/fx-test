# fx-bot — Asustor NAS deploy (prebuilt image, no SSH needed).
# 1. Copy ONLY this file's services block into Portainer → Stacks → Add stack
#    (or save as docker-compose.yml). No build step: the image comes ready
#    from Docker Hub and rebuilds automatically on every git push.
# 2. Set the DEMO IG_API_KEY / IG_USERNAME / IG_PASSWORD in the environment
#    block (or Portainer's Environment variables tab).
# 3. Deploy. On code updates: Containers → fx-bot → Recreate + ✔ Re-pull image.
# Dashboard: http://<nas-ip>:8082 (LAN + Tailscale). Logs persist in ./data.
services:
  fx-bot:
    image: stenknz/fx-test:latest
    container_name: fx-bot
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: Pacific/Auckland
      DATA_DIR: /data
      # Set these in the Portainer stack editor (Environment variables tab) —
      # never commit filled values. Equivalent to the file's commented block.
      IG_API_KEY: ${IG_API_KEY:-}
      IG_USERNAME: ${IG_USERNAME:-}
      IG_PASSWORD: ${IG_PASSWORD:-}
      # IG_ACCOUNT_ID: optional, only if the login has several accounts
    volumes:
      - /volume1/Docker/fx-bot/data:/data
